<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candle Battle social capture fixture</title>
<link rel="stylesheet" href="/css/candle-battles-dialogue.css">
<link rel="stylesheet" href="/css/candle-battle-social-capture.css">
<style>body{margin:0;padding:16px 0;background:#0b1622;color:#fff;font-family:system-ui}</style>
</head>
<body>
<main id="candle-battle-social-capture" class="cbs-capture" data-social-ready="false" data-capture-frame="pending" data-poster-size="1200x675" data-match-status="in_progress">
  <header class="cbs-capture__header">
    <div class="cbs-capture__brand">Cripto<span>Versus</span></div>
    <span class="cbs-capture__badge">Candle Battle</span>
    <strong class="cbs-capture__pairs"><span data-cb-capture="pairA">—</span> <i>vs</i> <span data-cb-capture="pairB">—</span></strong>
    <strong class="cbs-capture__status" data-cb-capture="status"></strong>
  </header>

  <section class="cbs-capture__stage">
    <div class="cbs-capture__arena">
      <div class="candle-battles__canvas candle-battles__canvas--capture" id="arena" role="img" aria-label="Candle Battle arena">
        <button type="button" class="candle-battles__freeze" data-cb-action="socialFreeze" hidden aria-hidden="true"></button>
      </div>
      <div class="cbs-capture__bubbles" data-cb-capture-bubbles>
        <div class="candle-battles__bubble candle-battles__bubble--speech cbs-capture__bubble cbs-capture__bubble--left" data-cb-capture-bubble="left" style="--tail-x:74%"><span data-cb-capture="bubbleLeft"></span></div>
        <div class="candle-battles__bubble candle-battles__bubble--speech cbs-capture__bubble cbs-capture__bubble--right" data-cb-capture-bubble="right" style="--tail-x:26%"><span data-cb-capture="bubbleRight"></span></div>
      </div>
      <div class="cbs-capture__rounds" data-cb-capture-rounds role="img" aria-label="Confrontations"></div>
    </div>

    <div class="cbs-capture__score">
      <span class="cbs-capture__side cbs-capture__side--left" data-cb-capture-side="left">
        <b data-cb-capture="shortA">—</b>
        <i data-cb-capture="tagA" hidden>WON</i>
      </span>
      <strong class="cbs-capture__points"><span data-cb-capture="scoreA">0</span> <em>×</em> <span data-cb-capture="scoreB">0</span></strong>
      <span class="cbs-capture__side cbs-capture__side--right" data-cb-capture-side="right">
        <i data-cb-capture="tagB" hidden>WON</i>
        <b data-cb-capture="shortB">—</b>
      </span>
    </div>
  </section>

  <footer class="cbs-capture__footer">
    <span class="cbs-capture__state-line" data-cb-capture="stateLine"></span>
    <span class="cbs-capture__disclaimer"><strong>CriptoVersus</strong><span>Historical market data. This is not financial advice.</span></span>
  </footer>
</main>

<script type="module">
import { create } from '/js/dist/candle-battles/game.js';
import { watchCaptureReadiness, fillCaptureDialogue } from '/js/candleBattleSocial.mjs';

const labels = { arcade: 'Arcade battle', forming: 'Candle forming', waiting: 'Waiting for confirmed candles', finished: 'Finished',
  matchTime: 'MATCH TIME', nextBattle: 'NEXT BATTLE', round: 'ROUND', fight: 'FIGHT!', wins: 'WINS', matchFinished: 'MATCH FINISHED',
  finalScore: 'FINAL SCORE', recent: 'RECENT BATTLES', lines: 'LINES', page: 'PAGE', territory: 'TERRITORY CONTROL', draw: 'DRAW',
  strength: 'STRENGTH', candleClose: '5-minute candle close', champion: 'Champion', watchReplay: 'Watch replay' };
window.engine = await create(document.querySelector('#arena'),
  { mode: 'live', culture: 'en-US', labels, battleDurationMs: 3000, socialCapture: true, shell: true });

const phrases = ['This battle is mine!', "It's not over yet!", "I'm taking this one today.", 'Your candle is way too weak for me.',
  "There's still a comeback, relax.", 'Take that!', 'I always close on the high.', 'Feeling the pressure already?',
  'My chart woke up angry today.', "Run all you want, I'll catch up.", "That wick doesn't fool me, pal!",
  "Tomorrow you'll tell this story differently.", "I'm just warming up the wallet.", 'Who messed with my trade now?'];
const set = (key, value) => { for (const el of document.querySelectorAll(`[data-cb-capture="${key}"]`)) el.textContent = value; };
const short = symbol => symbol.replace(/USDT$/i, '');
const pair = symbol => short(symbol) + '/USDT';

window.setCapture = ({ matchId, leftSymbol, rightSymbol, scoreA, scoreB, confrontations, expected, finished, winners = [] }) => {
  const root = document.querySelector('#candle-battle-social-capture');
  window.roundWinners = winners;
  const tiles = document.querySelector('[data-cb-capture-rounds]');
  tiles.replaceChildren();
  for (let i = 0; i < expected; i++) {
    const tile = document.createElement('i');
    const winner = winners[i];
    tile.className = winner === 'left' ? 'is-left' : winner === 'right' ? 'is-right' : winner == null ? 'is-pending' : 'is-draw';
    tiles.append(tile);
  }
  root.dataset.roundTiles = String(expected);
  set('pairA', pair(leftSymbol)); set('pairB', pair(rightSymbol));
  set('status', finished ? 'Completed' : 'In progress');
  document.querySelector('[data-cb-capture="status"]').classList.toggle('is-final', !!finished);
  root.dataset.matchStatus = finished ? 'finished' : 'in_progress';
  set('scoreA', String(scoreA)); set('scoreB', String(scoreB));
  set('shortA', short(leftSymbol)); set('shortB', short(rightSymbol));
  for (const el of document.querySelectorAll('[data-cb-capture="logoA"]')) el.src = '/futurebol/team-logo/' + encodeURIComponent(leftSymbol);
  for (const el of document.querySelectorAll('[data-cb-capture="logoB"]')) el.src = '/futurebol/team-logo/' + encodeURIComponent(rightSymbol);
  const leftWon = finished && scoreA > scoreB, rightWon = finished && scoreB > scoreA;
  document.querySelector('[data-cb-capture-side="left"]').classList.toggle('is-winner', leftWon);
  document.querySelector('[data-cb-capture-side="right"]').classList.toggle('is-winner', rightWon);
  for (const el of document.querySelectorAll('[data-cb-capture="tagA"]')) el.hidden = !leftWon;
  for (const el of document.querySelectorAll('[data-cb-capture="tagB"]')) el.hidden = !rightWon;
  const draw = finished && scoreA === scoreB;
  const winner = finished ? (draw ? 'draw' : leftWon ? 'left' : 'right') : null;
  const roundWinners = winners;
  const lastWinner = roundWinners.length ? roundWinners[roundWinners.length - 1] : null;
  let streak = 0;
  if (lastWinner === 'left' || lastWinner === 'right') {
    for (let i = roundWinners.length - 1; i >= 0 && roundWinners[i] === lastWinner; i--) streak++;
  }
  root.dataset.dialogueContext = JSON.stringify({
    matchId, culture: 'en-US', leftSymbol, rightSymbol, scoreA, scoreB,
    round: confrontations, expectedRounds: expected, finished, winner, lastWinner,
    streak: streak > 0 ? streak : null, hasVolume: true
  });
  if (!finished) {
    set('stateLine', `Current score · Round ${confrontations} of ${expected}`);
  } else if (draw) {
    set('stateLine', 'Final result · Draw');
  } else {
    set('stateLine', `Final result · ${short(leftWon ? leftSymbol : rightSymbol)} wins!`);
  }
  void fillCaptureDialogue('candle-battle-social-capture');
};

window.watchCapture = () => watchCaptureReadiness('candle-battle-social-capture', true,
  document.querySelector('#candle-battle-social-capture').dataset.matchStatus === 'finished');
window.ready = true;
</script>
</body>
</html>
